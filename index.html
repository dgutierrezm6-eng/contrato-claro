<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrato Claro</title>
  <!-- Tailwind CSS para estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f2b48] min-h-screen font-sans flex items-center justify-center p-4">

  <!-- ========================================== -->
  <!-- 1. VISTA DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
  <!-- ========================================== -->
  <div id="auth-screen" class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl my-8">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-2">
      <div class="bg-[#0f2b48] text-white p-2 rounded-lg">
        <i data-lucide="check-square" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-bold text-[#0f2b48]">Contrato Claro</h1>
    </div>
    <p class="text-xs text-gray-500 mb-6">Inicia sesión o crea una cuenta para guardar tus contratos de forma segura en Supabase.</p>

    <!-- Tabs para alternar entre Iniciar Sesión y Crear Cuenta -->
    <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
      <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-600 transition-all">
        Iniciar sesión
      </button>
      <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-[#00a884] shadow-sm transition-all">
        Crear cuenta
      </button>
    </div>

    <!-- Banner de Mensaje de Error / Éxito -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg border text-sm flex items-start gap-2">
      <i id="alert-icon" data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
      <span id="alert-message"></span>
    </div>

    <!-- Formulario de Registro / Login -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      
      <!-- Campo: Nombre completo (Solo Registro) -->
      <div id="field-name">
        <label class="block text-xs font-bold text-gray-700 mb-1">Nombre completo</label>
        <input type="text" id="input-name" placeholder="Ej. Danna Gutierrez" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884]">
      </div>

      <!-- Campo: Identificación / CC (Solo Registro) -->
      <div id="field-[#00a884]">
        <label class="block text-xs font-bold text-gray-700 mb-1">Identificación / CC</label>
        <input type="text" id="input-identification" placeholder="1025536586" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884]">
      </div>

      <!-- Campo: Correo -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Correo</label>
        <input type="email" id="input-email" required placeholder="dgutierrezm6@ucental.edu.co" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884]">
      </div>

      <!-- Campo: Contraseña -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="input-password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884]">
      </div>

      <!-- Campo: Rol (Solo Registro) -->
      <div id="field-role">
        <label class="block text-xs font-bold text-gray-700 mb-1">Eres...</label>
        <select id="input-role" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884] bg-white">
          <option value="Freelancer">Freelancer</option>
          <option value="Cliente">Cliente</option>
          <option value="Empresa">Empresa</option>
        </select>
      </div>

      <!-- Botón Submit -->
      <button type="submit" id="btn-auth-submit" class="w-full bg-[#00a884] hover:bg-[#008f70] text-white font-bold py-2.5 rounded-lg text-sm transition-all shadow-md flex items-center justify-center gap-2">
        <span id="btn-text">Crear cuenta</span>
        <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>
  </div>


  <!-- ========================================== -->
  <!-- 2. VISTA PRINCIPAL (PANEL DE CONTRATOS)   -->
  <!-- ========================================== -->
  <div id="app-screen" class="hidden w-full max-w-5xl mx-auto my-8 space-y-6">
    <!-- Header App -->
    <header class="bg-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-[#0f2b48] text-white p-2.5 rounded-xl">
          <i data-lucide="file-text" class="w-6 h-6"></i>
        </div>
        <div>
          <h2 class="text-xl font-bold text-[#0f2b48]">Panel de Contratos</h2>
          <p id="user-welcome" class="text-xs text-gray-500">Bienvenido/a</p>
        </div>
      </div>
      <button onclick="logout()" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-bold transition-all">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        Cerrar Sesión
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Formulario para Crear Nuevo Contrato -->
      <div class="bg-white rounded-2xl p-6 shadow-xl space-y-4">
        <h3 class="text-lg font-bold text-[#0f2b48] flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-[#00a884]"></i>
          Nuevo Contrato
        </h3>
        
        <form id="contract-form" onsubmit="handleCreateContract(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Título del Contrato</label>
            <input type="text" id="contract-title" required placeholder="Ej. Desarrollo Web Frontend" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00a884] focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Cliente / Contraparte</label>
            <input type="text" id="contract-client" required placeholder="Nombre o Empresa" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00a884] focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Monto ($ COP)</label>
            <input type="number" id="contract-amount" required placeholder="1500000" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00a884] focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Descripción / Términos</label>
            <textarea id="contract-description" rows="3" required placeholder="Detalles del acuerdo o servicio..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#00a884] focus:outline-none"></textarea>
          </div>

          <button type="submit" id="btn-create-contract" class="w-full bg-[#00a884] hover:bg-[#008f70] text-white font-bold py-2 rounded-lg text-sm transition-all shadow-md">
            Guardar Contrato
          </button>
        </form>
      </div>

      <!-- Lista de Contratos Guardados -->
      <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-lg font-bold text-[#0f2b48] flex items-center gap-2">
            <i data-lucide="files" class="w-5 h-5 text-[#00a884]"></i>
            Mis Contratos
          </h3>
          <button onclick="loadContracts()" class="text-xs text-[#00a884] hover:underline font-semibold flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Actualizar
          </button>
        </div>

        <div id="contracts-container" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- LÓGICA DE JAVASCRIPT & CONEXIÓN API        -->
  <!-- ========================================== -->
  <script>
    // Configuración de la URL de tu API en Render
    const API_URL = 'https://contrato-claro-backend.onrender.com/api';
    
    let currentAuthMode = 'register'; // 'register' o 'login'
    let currentUser = null;

    // Inicialización al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkAuth();
    });

    // Cambiar entre Pestañas Login / Registro
    function switchAuthTab(mode) {
      currentAuthMode = mode;
      hideAlert();

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const fieldName = document.getElementById('field-name');
      const fieldIdent = document.getElementById('field-identification');
      const fieldRole = document.getElementById('field-role');
      const btnText = document.getElementById('btn-text');

      if (mode === 'register') {
        tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-[#00a884] shadow-sm transition-all";
        tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-600 transition-all";
        fieldName.classList.remove('hidden');
        fieldIdent.classList.remove('hidden');
        fieldRole.classList.remove('hidden');
        btnText.textContent = "Crear cuenta";
      } else {
        tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-[#00a884] shadow-sm transition-all";
        tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-600 transition-all";
        fieldName.classList.add('hidden');
        fieldIdent.classList.add('hidden');
        fieldRole.classList.add('hidden');
        btnText.textContent = "Iniciar sesión";
      }
    }

    // Verificar si el usuario ya tiene sesión iniciada
    function checkAuth() {
      const token = localStorage.getItem('token');
      const savedUser = localStorage.getItem('user');

      if (token && savedUser) {
        currentUser = JSON.parse(savedUser);
        showAppScreen();
      } else {
        showAuthScreen();
      }
    }

    // Enviar Registro o Login a la API
    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAlert();
      setLoading(true);

      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value.trim();

      const endpoint = currentAuthMode === 'register' ? `${API_URL}/register` : `${API_URL}/login`;
      
      const payload = currentAuthMode === 'register' ? {
        name: document.getElementById('input-name').value.trim(),
        identification: document.getElementById('input-identification').value.trim(),
        email: email,
        password: password,
        role: document.getElementById('input-role').value
      } : { email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || 'Error en el servidor');
        }

        if (currentAuthMode === 'register') {
          showAlert('¡Cuenta creada con éxito! Ahora puedes iniciar sesión.', 'success');
          switchAuthTab('login');
        } else {
          // Login Exitoso
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user || { email }));
          currentUser = data.user || { email };
          showAppScreen();
        }
      } catch (err) {
        showAlert(err.message === 'Failed to fetch' 
          ? 'No se pudo conectar con el servidor. Verifica que Render esté activo.' 
          : err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    // Cargar contratos del usuario desde la BD
    async function loadContracts() {
      const container = document.getElementById('contracts-container');
      container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">Cargando contratos...</div>`;

      const token = localStorage.getItem('token');

      try {
        const response = await fetch(`${API_URL}/contracts`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('No se pudieron obtener los contratos');

        const contracts = await response.json();

        if (!contracts || contracts.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 border-2 border-dashed border-gray-200 rounded-xl">
              <i data-lucide="folder-open" class="w-8 h-8 mx-auto text-gray-300 mb-2"></i>
              <p class="text-sm text-gray-500 font-medium">Aún no tienes contratos registrados.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = contracts.map(c => `
          <div class="border border-gray-100 bg-gray-50/50 hover:bg-gray-50 rounded-xl p-4 transition-all space-y-2">
            <div class="flex justify-between items-start">
              <h4 class="font-bold text-[#0f2b48] text-sm">${c.title || 'Sin Título'}</h4>
              <span class="text-xs bg-[#00a884]/10 text-[#00a884] font-bold px-2 py-0.5 rounded-full">
                $${Number(c.amount || 0).toLocaleString('es-CO')}
              </span>
            </div>
            <p class="text-xs text-gray-600 line-clamp-2">${c.description || ''}</p>
            <div class="flex justify-between items-center text-[11px] text-gray-400 pt-1 border-t border-gray-100">
              <span>Cliente: <strong>${c.client || 'N/A'}</strong></span>
              <span>${c.created_at ? new Date(c.created_at).toLocaleDateString('es-CO') : ''}</span>
            </div>
          </div>
        `).join('');

        lucide.createIcons();
      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-red-500 text-xs">Error al cargar datos.</div>`;
      }
    }

    // Crear un nuevo contrato
    async function handleCreateContract(e) {
      e.preventDefault();
      const token = localStorage.getItem('token');

      const payload = {
        title: document.getElementById('contract-title').value.trim(),
        client: document.getElementById('contract-client').value.trim(),
        amount: parseFloat(document.getElementById('contract-amount').value),
        description: document.getElementById('contract-description').value.trim()
      };

      try {
        const response = await fetch(`${API_URL}/contracts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Error al guardar el contrato');

        document.getElementById('contract-form').reset();
        loadContracts();
      } catch (err) {
        alert(err.message);
      }
    }

    // Auxiliares de Interfaz
    function showAuthScreen() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    }

    function showAppScreen() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-welcome').textContent = `Hola, ${currentUser.name || currentUser.email}`;
      loadContracts();
    }

    function logout() {
      localStorage.clear();
      checkAuth();
    }

    function showAlert(msg, type = 'error') {
      const alertBox = document.getElementById('alert-box');
      const alertMsg = document.getElementById('alert-message');
      
      alertBox.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
      } else {
        alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      }

      alertMsg.textContent = msg;
    }

    function hideAlert() {
      document.getElementById('alert-box').classList.add('hidden');
    }

    function setLoading(isLoading) {
      const btnSpinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const btnSubmit = document.getElementById('btn-auth-submit');

      btnSubmit.disabled = isLoading;
      if (isLoading) {
        btnSpinner.classList.remove('hidden');
        btnText.classList.add('opacity-50');
      } else {
        btnSpinner.classList.add('hidden');
        btnText.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
