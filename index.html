<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:37px;height:37px;border-radius:10px;background:var(--navy);position:relative}.logo:after{content:'✓';position:absolute;color:#fff;font-weight:900;font-size:25px;left:9px;top:0}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:-5px}.actions{display:flex;align-items:center;gap:10px}.badge{background:#e9fbf1;color:#087c38;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:#d9e2ec;display:grid;place-items:center;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px}nav button{display:flex;width:100%;border:0;background:transparent;color:#486581;padding:11px 13px;border-radius:99px;text-align:left;gap:10px;cursor:pointer;font-weight:650;margin:3px 0}nav button.active,nav button:hover{background:#e9f7f7;color:#087f80}nav .sep{margin:20px 12px 8px;color:#9fb3c8;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}main{padding:30px;max-width:1360px;width:100%;margin:auto}.hero{background:linear-gradient(115deg,#0b2545,#124e78);padding:28px 30px;border-radius:17px;color:#fff;display:flex;justify-content:space-between;gap:25px;align-items:center;box-shadow:var(--shadow)}.hero h1{font-size:27px;margin:0 0 6px}.hero p{opacity:.87;max-width:630px;margin:0}.hero .trust{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:13px 16px;min-width:204px}.trust b{display:block;font-size:21px}.primary,.secondary,.ghost{border:0;border-radius:99px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff;box-shadow:0 7px 18px rgba(0,166,166,.25)}.primary:hover{background:#008f8f;transform:translateY(-1px)}.secondary{color:#087f80;background:#e9f7f7}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:29px 0 14px}.section-head h2{font-size:20px;margin:0}.section-head p{margin:3px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 5px 17px rgba(16,42,67,.035)}.card:hover{border-color:#7ed9d9;box-shadow:var(--shadow)}.icon{width:41px;height:41px;border-radius:11px;display:grid;place-items:center;font-size:21px;background:#e9f7f7;margin-bottom:12px}.card h3{margin:0 0 5px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;min-height:41px}.card button{margin-top:16px;width:100%}.steps{display:flex;gap:0;margin:10px 0 24px}.step{flex:1;display:flex;gap:9px;align-items:center;color:#829ab1;font-weight:700}.step:after{content:'';height:2px;flex:1;background:#d9e2ec;margin-left:8px}.step:last-child:after{display:none}.num{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#d9e2ec;color:#486581;font-size:13px}.step.on{color:#087f80}.step.on .num{background:var(--teal);color:#fff}.wizard{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#334e68}input,select,textarea{bord ize:14px;margin:16px 0}.legal{font-size:12px;color:#627d98;margin-top:22px}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(115deg,#0b2545,#124e78);padding:20px}
.auth-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:400px}
.auth-brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;margin-bottom:6px}
.auth-tabs{display:flex;gap:6px;background:#f0f4f8;border-radius:9px;padding:4px;margin:18px 0}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-weight:800;color:#627d98;cursor:pointer}
.auth-tabs button.active{background:#fff;color:#087f80;box-shadow:0 2px 6px rgba(16,42,67,.08)}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.auth-form{display:none}
.auth-form.active{display:block}
#authError{display:none}

@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr 1fr}.wizard{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.top{padding:0 16px}.top .badge{display:none}main{padding:18px}.hero{padding:22px}.hero h1{font-size:23px}.grid,.fields,.metric{grid-template-columns:1fr}.step{font-size:11px}.step:after{margin-left:3px}.actions .ghost{display:none}}
</style>
