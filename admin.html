<script>
    // 1. REEMPLAZA CON TUS CREDENCIALES EXACTAS DE INDEX.HTML
    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
    const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function validarAcceso(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');

        if (email === "jmartinezl10@ucentral.edu.co" && password === "1234567890") {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            errorMessage.textContent = '';
            
            // Cargar datos
            cargarDatosDashboard();
        } else {
            errorMessage.textContent = "Acceso denegado. Credenciales incorrectas.";
        }
    }

    async function cargarDatosDashboard() {
        console.log("Iniciando consulta a Supabase...");

        // A) Consultar Contratos
        const { data: contratos, error: errContratos } = await _supabase
            .from('contratos')
            .select('*');

        if (errContratos) {
            console.error("Error al cargar contratos:", errContratos);
            document.getElementById('tablaContratos').innerHTML = `<tr><td colspan="4" style="color:red;">Error: ${errContratos.message} (Revisa políticas RLS)</td></tr>`;
            document.getElementById('totalContratos').textContent = 'Error';
        } else if (contratos) {
            document.getElementById('totalContratos').textContent = contratos.length;
            renderContratos(contratos);
        }

        // B) Consultar Disputas
        const { data: disputas, error: errDisputas } = await _supabase
            .from('disputas')
            .select('*');

        if (errDisputas) {
            console.error("Error al cargar disputas:", errDisputas);
            document.getElementById('tablaDisputas').innerHTML = `<tr><td colspan="3" style="color:red;">Error: ${errDisputas.message}</td></tr>`;
            document.getElementById('totalDisputas').textContent = '0';
        } else if (disputas) {
            document.getElementById('totalDisputas').textContent = disputas.length;
            renderDisputas(disputas);
        }

        // C) Consultar Partes / Usuarios
        const { data: partes, error: errPartes } = await _supabase
            .from('partes_contrato')
            .select('*');

        if (errPartes) {
            console.error("Error al cargar partes:", errPartes);
            document.getElementById('tablaUsuarios').innerHTML = `<tr><td colspan="4" style="color:red;">Error: ${errPartes.message}</td></tr>`;
            document.getElementById('totalUsuarios').textContent = '0';
        } else if (partes) {
            document.getElementById('totalUsuarios').textContent = partes.length;
            renderUsuarios(partes);
        }
    }

    function renderUsuarios(lista) {
        const tbody = document.getElementById('tablaUsuarios');
        if(!lista || lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No hay usuarios/partes registrados en la tabla partes_contrato.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(u => `
            <tr>
                <td style="font-size:11px; color:#627d98;">${u.id || 'N/A'}</td>
                <td><strong>${u.nombre || u.usuario_id || 'Sin Nombre'}</strong></td>
                <td>${u.correo || u.email || 'N/A'}</td>
                <td><span class="badge badge-active">${u.rol || 'Participante'}</span></td>
            </tr>
        `).join('');
    }

    function renderContratos(lista) {
        const tbody = document.getElementById('tablaContratos');
        if(!lista || lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No hay contratos guardados en la base de datos.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(c => `
            <tr>
                <td><strong>${c.titulo || c.descripcion || 'Contrato sin título'}</strong></td>
                <td>$${c.monto_total || c.monto || 0}</td>
                <td><span class="badge badge-pending">${c.estado || 'Activo'}</span></td>
                <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : 'N/A'}</td>
            </tr>
        `).join('');
    }

    function renderDisputas(lista) {
        const tbody = document.getElementById('tablaDisputas');
        if(!lista || lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">No hay disputas registradas.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(d => `
            <tr>
                <td>${d.contrato_id || 'N/A'}</td>
                <td>${d.motivo || d.descripcion || 'Sin detalle'}</td>
                <td><span class="badge badge-pending">${d.estado || 'Abierta'}</span></td>
            </tr>
        `).join('');
    }

    function cerrarSesion() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    }

    function cambiarTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel-section').forEach(sec => sec.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
    }
</script>
