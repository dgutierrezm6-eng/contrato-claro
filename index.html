<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Claro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#f6f9fc;color:#102a43}
.auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b2545,#124e78);padding:20px}
.auth-card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 14px 40px rgba(16,42,67,0.1)}
.auth-brand{font-weight:800;font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:#0b2545;border-radius:8px;position:relative}
.logo:after{content:"✓";position:absolute;color:#fff;font-weight:900;font-size:20px;left:7px;top:-2px}
.auth-tabs{display:flex;gap:6px;background:#f0f4f8;border-radius:9px;padding:4px;margin:18px 0}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-weight:800;color:#627d98;cursor:pointer}
.auth-tabs button.active{background:#fff;color:#087f80;box-shadow:0 2px 6px rgba(16,42,67,0.08)}
.auth-field{margin-bottom:13px}
.auth-field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#334e68}
.auth-field input,.auth-field select{width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px;font-size:14px}
.auth-field input:focus,.auth-field select:focus{outline:none;border-color:#00a6a6;box-shadow:0 0 0 3px rgba(0,166,166,0.1)}
.btn-primary{width:100%;background:#00a6a6;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;font-size:15px}
.btn-primary:hover{background:#008f8f}
.alert{background:#fef2f0;color:#b42318;padding:12px;border-radius:7px;margin:16px 0;border-left:4px solid #b42318;display:none}
.auth-form{display:none}
.auth-form.active{display:block}
.app{display:none}
.app.active{display:block}
</style>
</head>
<body>

<!-- LOGIN / REGISTRO -->
<div id="authScreen" class="auth-container">
  <div class="auth-card">
    <div class="auth-brand"><div class="logo"></div>Contrato Claro</div>
    <p style="font-size:13px;color:#627d98;margin-bottom:18px">Plataforma freelance con custodia de fondos</p>

    <div class="auth-tabs">
      <button id="tabLoginBtn" class="active" type="button" onclick="showLogin()">Iniciar sesión</button>
      <button id="tabRegisterBtn" type="button" onclick="showRegister()">Crear cuenta</button>
    </div>

    <div id="authError" class="alert"></div>

    <form id="loginForm" class="auth-form active">
      <div class="auth-field">
        <label for="loginCorreo">Correo</label>
        <input id="loginCorreo" type="email" required placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="auth-field">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" required placeholder="••••••••">
      </div>
      <button class="btn-primary" type="submit">Entrar</button>
    </form>

    <form id="registerForm" class="auth-form">
      <div class="auth-field">
        <label for="regNombre">Nombre completo</label>
        <input id="regNombre" required placeholder="Tu nombre">
      </div>
      <div class="auth-field">
        <label for="regCorreo">Correo</label>
        <input id="regCorreo" type="email" required placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="auth-field">
        <label for="regPassword">Contraseña</label>
        <input id="regPassword" type="password" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="auth-field">
        <label for="regRol">Eres...</label>
        <select id="regRol">
          <option value="Freelancer">Freelancer</option>
          <option value="Cliente o Contratante">Cliente / Contratante</option>
        </select>
      </div>
      <button class="btn-primary" type="submit">Crear cuenta</button>
    </form>
  </div>
</div>

<!-- APLICACIÓN PRINCIPAL -->
<div id="appRoot" class="app">
  <div style="background:#fff;padding:15px 28px;border-bottom:1px solid #d9e2ec;display:flex;justify-content:space-between;align-items:center">
    <div style="font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px"><div class="logo"></div>Contrato Claro</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="sessionBadge" style="background:#e9fbf1;color:#087c38;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800">● Sesión</span>
      <button onclick="handleLogout()" style="background:#d9e2ec;border:0;border-radius:50%;width:34px;height:34px;font-weight:800;cursor:pointer">FC</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 68px)">
    <aside style="background:#fff;border-right:1px solid #d9e2ec;padding:22px 14px">
      <nav style="display:flex;flex-direction:column;gap:3px">
        <button onclick="showView('inicio')" style="background:#e9f7f7;color:#087f80;border:0;padding:11px 13px;border-radius:9px;text-align:left;cursor:pointer;font-weight:650">⌂ Inicio</button>
        <button onclick="showView('crear')" style="background:transparent;border:0;padding:11px 13px;border-radius:9px;text-align:left;cursor:pointer;font-weight:650;color:#486581">＋ Crear</button>
        <button onclick="showView('contratos')" style="background:transparent;border:0;padding:11px 13px;border-radius:9px;text-align:left;cursor:pointer;font-weight:650;color:#486581">▣ Contratos</button>
        <button onclick="showView('calculadora')" style="background:transparent;border:0;padding:11px 13px;border-radius:9px;text-align:left;cursor:pointer;font-weight:650;color:#486581">▤ Calculadora</button>
      </nav>
    </aside>
    <main style="padding:30px">
      <section id="view-inicio">
        <div style="background:linear-gradient(115deg,#0b2545,#124e78);padding:28px 30px;border-radius:17px;color:#fff;margin-bottom:29px">
          <h1 style="font-size:27px;margin:0 0 6px">Trabaja con seguridad</h1>
          <p style="opacity:0.87;margin:0">Contratos con custodia, hitos y disputas</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div style="background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:19px">
            <div style="font-size:21px;margin-bottom:12px">🧾</div>
            <h3 style="margin:0 0 5px;font-size:16px">Prestación de Servicios</h3>
            <button onclick="startContract('Prestación de Servicios')" style="width:100%;background:#00a6a6;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;margin-top:16px">Usar plantilla</button>
          </div>
        </div>
      </section>

      <!-- FORMULARIO DE CREAR CONTRATO -->
      <section id="view-crear" style="display:none">
        <h2 style="margin-bottom:20px">Crear contrato</h2>
        <div style="background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:24px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
            <div><label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Tipo</label><select id="tipo" style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px"><option>Prestación de Servicios</option><option>Obra/Proyecto</option><option>Consultoría</option></select></div>
            <div><label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Título</label><input id="titulo" style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px"></div>
            
            <div style="grid-column:1/-1">
              <label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Correo de la otra parte (Debe estar registrado)</label>
              <input id="correo_contraparte" type="email" placeholder="cliente_o_freelancer@gmail.com" required style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px">
            </div>

            <div style="grid-column:1/-1"><label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Objeto</label><textarea id="objeto" style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px;min-height:88px"></textarea></div>
            <div><label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Valor (COP)</label><input id="valor" type="number" style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px"></div>
            <div><label style="display:block;font-size:13px;font-weight:800;margin-bottom:6px">Pago</label><select id="forma_pago" style="width:100%;padding:10px;border:1px solid #bcccdc;border-radius:8px"><option>Por Hitos</option><option>Pago Único</option><option>50/50</option></select></div>
          </div>
          <button onclick="createContract()" style="width:100%;background:#00a6a6;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;margin-top:20px">Guardar contrato</button>
        </div>
      </section>

      <section id="view-contratos" style="display:none">
        <h2 style="margin-bottom:20px">Mis contratos</h2>
        <div id="contractList"></div>
      </section>

      <section id="view-calculadora" style="display:none">
        <h2 style="margin-bottom:20px">Calculadora</h2>
        <div style="background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:24px">
          <p>Horas: <input type="number" id="horas" value="40" oninput="calc()"></p>
          <p>Tarifa: <input type="number" id="tarifa" value="50000" oninput="calc()"></p>
          <p>Base: <b id="base">$0</b></p>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
// --- CONFIGURACIÓN ---
var SUPABASE_URL = 'https://gftdhhvsjpojxkdyuvpl.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmdGRoaHZzanBvanhrZHl1dnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDQ5NjQsImV4cCI6MjEwNDYyMDk2NH0.Y5T1C7yJGOWP7Je55qOPY_3oOyvtOLFnGRWZN3nm0wA';
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var BACKEND_URL = 'https://contrato-claro-backend.onrender.com';

function $(id) { return document.getElementById(id); }

// --- VISTAS Y TABS ---
function showLogin() {
  $('tabLoginBtn').classList.add('active'); $('tabRegisterBtn').classList.remove('active');$('loginForm').classList.add('active'); $('registerForm').classList.remove('active');$('authError').style.display = 'none';
}

function showRegister() {
  $('tabRegisterBtn').classList.add('active'); $('tabLoginBtn').classList.remove('active');$('registerForm').classList.add('active'); $('loginForm').classList.remove('active');$('authError').style.display = 'none';
}

function showView(view) {
  ['inicio', 'crear', 'contratos', 'calculadora'].forEach(function(v) {
    $('view-' + v).style.display = v === view ? 'block' : 'none';
  });
  if (view === 'contratos') loadContracts();
}

function startContract(tipo) { $('tipo').value = tipo; showView('crear'); }

// --- AUTENTICACIÓN ---
$('loginForm').addEventListener('submit', async function(e) {   e.preventDefault();$('authError').style.display = 'none';
  try {
    var result = await supabase.auth.signInWithPassword({
      email: $('loginCorreo').value.trim(),
      password: $('loginPassword').value
    });
    if (result.error) throw result.error;
    checkSession();
  } catch (err) {
    $('authError').textContent = err.message;
    $('authError').style.display = 'block';
  }
});

$('registerForm').addEventListener('submit', async function(e) {   e.preventDefault();$('authError').style.display = 'none';
  try {
    var result = await supabase.auth.signUp({
      email: $('regCorreo').value.trim(),
      password: $('regPassword').value,
      options: { data: { nombre: $('regNombre').value.trim(), rol:$('regRol').value } }
    });
    if (result.error) throw result.error;
    alert('Registro exitoso. Inicia sesión ahora.');
    showLogin();
  } catch (err) {
    $('authError').textContent = err.message;
    $('authError').style.display = 'block';
  }
});

async function handleLogout() {
  await supabase.auth.signOut();
  $('appRoot').classList.remove('active');$('authScreen').style.display = 'flex';
}

// --- LOGICA DE CONTRATOS ---
async function createContract() {
  var tipo = $('tipo').value;
  var titulo = $('titulo').value.trim();
  var objeto = $('objeto').value.trim();
  var valor = parseFloat($('valor').value);
  var forma_pago = $('forma_pago').value;
  var correoContraparte = $('correo_contraparte').value.trim().toLowerCase();

  if (!titulo || !objeto || isNaN(valor) || !correoContraparte) { 
    alert('Por favor completa todos los campos, incluyendo el correo de la otra parte.'); 
    return; 
  }

  try {
    var userResponse = await supabase.auth.getUser();
    var user = userResponse.data.user;
    if (!user) throw new Error("No hay una sesión activa.");

    var buscaContraparte = await supabase.from('perfiles_usuario').select('id').eq('correo', correoContraparte).maybeSingle();

    if (!buscaContraparte.data) {
      alert('❌ ERROR: El correo ' + correoContraparte + ' no está registrado en la plataforma. Dile a esa persona que cree su cuenta primero.');
      return;
    }

    var perfilRes = await supabase.from('perfiles_usuario').select('rol').eq('id', user.id).single();
    var miRol = perfilRes.data ? perfilRes.data.rol : 'Freelancer';
    var rolContraparte = miRol.toLowerCase().includes('cliente') ? 'Freelancer' : 'Cliente';

    var response = await supabase.from('contratos').insert([{
      tipo: tipo, titulo: titulo, objeto: objeto, valor: valor, forma_pago: forma_pago, estado: 'Activo (Fondeado)'
    }]).select();

    if (response.error) throw response.error;
    var nuevoContrato = response.data[0];

    await supabase.from('partes_contrato').insert([{ contrato_id: nuevoContrato.id, perfil_id: user.id, rol_en_contrato: miRol }]);
    await supabase.from('partes_contrato').insert([{ contrato_id: nuevoContrato.id, perfil_id: buscaContraparte.data.id, rol_en_contrato: rolContraparte }]);

    alert('✅ ¡Contrato creado y vinculado exitosamente!');
    $('titulo').value = '';$('objeto').value = ''; $('valor').value = '';$('correo_contraparte').value = '';
    showView('contratos');

  } catch (err) {
    alert('Error al guardar el contrato: ' + err.message);
  }
}

async function loadContracts() {
  var container = $('contractList');
  container.innerHTML = '<p style="color:#627d98;">Cargando tus contratos...</p>';

  try {
    var userResponse = await supabase.auth.getUser();
    var user = userResponse.data.user;

    var response = await supabase
      .from('partes_contrato')
      .select('rol_en_contrato, contratos(*)')
      .eq('perfil_id', user.id)
      .order('created_at', { ascending: false, foreignTable: 'contratos' });

    var registros = response.data;

    if (!registros || registros.length === 0) {
      container.innerHTML = `<div style="background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:24px;text-align:center;"><p style="color:#627d98;">No tienes contratos asignados.</p></div>`;
      return;
    }

    container.innerHTML = registros.map(function(item) {
      if(!item.contratos) return '';
      var c = item.contratos;
      var miRolEnContrato = item.rol_en_contrato;
      var esCliente = miRolEnContrato && miRolEnContrato.toLowerCase().includes('cliente');
      var accionEscrow = '';

      if (c.estado === 'Finalizado') {
        accionEscrow = esCliente 
          ? `<span style="background:#e9fbf1;color:#087c38;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:bold;">✅ Dinero entregado al freelancer</span>`
          : `<span style="background:#e9fbf1;color:#087c38;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:bold;">🎉 Pago recibido en tu cuenta</span>`;
      } else {
        accionEscrow = esCliente 
          ? `<button onclick="liberarEscrow('${c.id}')" style="background:#00a6a6;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;">🔓 Liberar Fondos al Freelancer</button>`
          : `<span style="background:#f0f4f8;color:#627d98;padding:8px 12px;border-radius:6px;font-size:13px;font-style:italic;">⏳ Esperando que el cliente libere el pago</span>`;
      }

      return `
        <div style="background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:20px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <h3 style="margin:0;font-size:16px;">${c.titulo}</h3>
            <span style="background:#e9fbf1;color:#087c38;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:800;">$${Number(c.valor || 0).toLocaleString('es-CO')}</span>
          </div>
          <p style="font-size:13px;color:#486581;margin-bottom:10px;">${c.objeto}</p>
          <div style="display:flex;gap:12px;font-size:12px;color:#627d98;margin-bottom:12px;flex-wrap:wrap;">
            <span>Rol: <b>${miRolEnContrato}</b></span> |
            <span>Estado: <b>${c.estado}</b></span>
          </div>
          <div style="border-top:1px solid #f0f4f8;padding-top:15px;margin-top:10px;">
            ${accionEscrow}
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    container.innerHTML = '<p style="color:#b42318;">Error al cargar contratos: ' + err.message + '</p>';
  }
}

async function liberarEscrow(contratoId) {
  if (!confirm('¿Estás seguro de que deseas liberar los fondos al freelancer?')) return;
  try {
    var response = await fetch(`${BACKEND_URL}/api/escrow/liberar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contrato_id: contratoId })
    });
    var data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Error al procesar.');
    alert('¡Fondos liberados exitosamente!');
    loadContracts();
  } catch (err) {
    alert('Error en el servidor: ' + err.message);
  }
}

function calc() {
  var base = Number($('horas').value) * Number($('tarifa').value);
  $('base').textContent = '$' + base.toLocaleString('es-CO');
}

async function checkSession() {
  var sessionResponse = await supabase.auth.getSession();
  if (sessionResponse.data && sessionResponse.data.session) {
    var user = sessionResponse.data.session.user;
    $('sessionBadge').textContent = '● ' + (user.user_metadata.nombre || user.email);
    $('authScreen').style.display = 'none';$('appRoot').classList.add('active');
    showView('inicio');
  } else {
    $('appRoot').classList.remove('active');$('authScreen').style.display = 'flex';
  }
}

checkSession();
</script>
</body>
</html>
